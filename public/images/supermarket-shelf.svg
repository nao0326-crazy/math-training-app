<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="スーパーの棚。たまご1パック120円、牛乳1本180円、食パン1袋150円、りんご1ふさ260円。">
  <title>スーパーの棚の値札</title>

  <!-- 背景 -->
  <rect x="0" y="0" width="800" height="460" fill="#f3f7fb" />

  <!-- 棚の板 (2段) -->
  <rect x="30" y="30" width="740" height="400" rx="12" fill="#e6edf5" stroke="#b9c6d6" stroke-width="3" />
  <rect x="30" y="238" width="740" height="16" fill="#c7d4e2" />

  <!-- ===== 上段: 4商品 ===== -->
  <!-- 商品1: たまご -->
  <g>
    <rect x="60" y="90" width="150" height="130" rx="10" fill="#fffdf5" stroke="#d9c98a" stroke-width="3" />
    <ellipse cx="135" cy="150" rx="42" ry="34" fill="#f6e7c1" stroke="#c9a86a" stroke-width="3" />
    <circle cx="118" cy="142" r="6" fill="#fff" opacity="0.7" />
    <circle cx="150" cy="158" r="6" fill="#fff" opacity="0.7" />
    <text x="135" y="205" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#5a4a2a">たまご</text>
  </g>

  <!-- 商品2: 牛乳 -->
  <g>
    <rect x="240" y="90" width="150" height="130" rx="10" fill="#fbfdff" stroke="#9fb8d0" stroke-width="3" />
    <path d="M300 110 h40 l10 20 v70 a8 8 0 0 1 -8 8 h-44 a8 8 0 0 1 -8 -8 v-70 z" fill="#eaf3fb" stroke="#7f9dba" stroke-width="3" />
    <rect x="292" y="104" width="56" height="12" rx="4" fill="#7f9dba" />
    <text x="315" y="205" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#33566f">ぎゅうにゅう</text>
  </g>

  <!-- 商品3: 食パン -->
  <g>
    <rect x="420" y="90" width="150" height="130" rx="10" fill="#fffaf0" stroke="#d8b979" stroke-width="3" />
    <path d="M445 190 v-50 a15 15 0 0 1 15 -15 h70 a15 15 0 0 1 15 15 v50 a8 8 0 0 1 -8 8 h-84 a8 8 0 0 1 -8 -8 z" fill="#e9c98a" stroke="#b98f4e" stroke-width="3" />
    <rect x="470" y="128" width="60" height="34" rx="6" fill="#f6dfae" opacity="0.8" />
    <text x="495" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8a6530">食パン</text>
  </g>

  <!-- 商品4: りんご -->
  <g>
    <rect x="600" y="90" width="150" height="130" rx="10" fill="#fff5f5" stroke="#d99a9a" stroke-width="3" />
    <circle cx="648" cy="152" r="30" fill="#e0533f" stroke="#b23c2c" stroke-width="3" />
    <circle cx="712" cy="160" r="26" fill="#e8604a" stroke="#b23c2c" stroke-width="3" />
    <path d="M648 122 q4 -12 14 -14" stroke="#6b4a2a" stroke-width="3" fill="none" />
    <text x="675" y="205" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#8a2f22">りんご</text>
  </g>

  <!-- 上段の値札 -->
  <g font-family="sans-serif">
    <rect x="60" y="46" width="150" height="34" rx="6" fill="#ffe9a8" stroke="#e0b84a" stroke-width="2" />
    <text x="135" y="69" text-anchor="middle" font-size="22" font-weight="bold" fill="#7a5b00">120円</text>

    <rect x="240" y="46" width="150" height="34" rx="6" fill="#ffe9a8" stroke="#e0b84a" stroke-width="2" />
    <text x="315" y="69" text-anchor="middle" font-size="22" font-weight="bold" fill="#7a5b00">180円</text>

    <rect x="420" y="46" width="150" height="34" rx="6" fill="#ffe9a8" stroke="#e0b84a" stroke-width="2" />
    <text x="495" y="69" text-anchor="middle" font-size="22" font-weight="bold" fill="#7a5b00">150円</text>

    <rect x="600" y="46" width="150" height="34" rx="6" fill="#ffe9a8" stroke="#e0b84a" stroke-width="2" />
    <text x="675" y="69" text-anchor="middle" font-size="22" font-weight="bold" fill="#7a5b00">260円</text>
  </g>

  <!-- ===== 下段 ===== -->
  <!-- 商品5: ジュース -->
  <g>
    <rect x="60" y="300" width="200" height="110" rx="10" fill="#fff6f0" stroke="#d99a6a" stroke-width="3" />
    <rect x="120" y="320" width="52" height="80" rx="8" fill="#f0913f" stroke="#c66a22" stroke-width="3" />
    <rect x="112" y="312" width="68" height="12" rx="4" fill="#c66a22" />
    <text x="160" y="396" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#8a4a1a">オレンジジュース</text>
  </g>

  <!-- 商品6: お菓子 -->
  <g>
    <rect x="290" y="300" width="200" height="110" rx="10" fill="#fff8fb" stroke="#d09ac0" stroke-width="3" />
    <rect x="345" y="330" width="90" height="56" rx="8" fill="#e07ab8" stroke="#b0508c" stroke-width="3" />
    <path d="M345 330 l20 -18 l25 18 l25 -18 l20 18 z" fill="#f0a8d0" stroke="#b0508c" stroke-width="3" />
    <text x="390" y="396" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#8a2f66">クッキー</text>
  </g>

  <!-- 下段の値札 -->
  <g font-family="sans-serif">
    <rect x="85" y="256" width="150" height="34" rx="6" fill="#ffe9a8" stroke="#e0b84a" stroke-width="2" />
    <text x="160" y="279" text-anchor="middle" font-size="22" font-weight="bold" fill="#7a5b00">200円</text>

    <rect x="315" y="256" width="150" height="34" rx="6" fill="#ffe9a8" stroke="#e0b84a" stroke-width="2" />
    <text x="390" y="279" text-anchor="middle" font-size="22" font-weight="bold" fill="#7a5b00">90円</text>
  </g>
</svg>
